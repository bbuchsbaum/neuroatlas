# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches-ignore:
      - ghpages
      - gh-pages
  pull_request:
    branches: [main, master]

name: test-coverage

permissions:
  contents: read
  id-token: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RGL_USE_NULL: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          pct <- round(covr::percent_coverage(cov), 2)
          cat(sprintf("Overall coverage: %s%%\n", pct))
          writeLines(as.character(pct), "coverage-percent.txt")
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Report coverage percent
        run: |
          echo "Overall package coverage: $(cat coverage-percent.txt)%"

      # OIDC is unavailable on pull_request jobs from forks; skip upload there so
      # coverage still runs without failing CI for external contributors.
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          fail_ci_if_error: true
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          use_oidc: true

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
