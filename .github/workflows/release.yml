name: Releases

on:
  workflow_run:
    workflows:
      - "check package on main with project conventions"
      - "R-CMD-check-OS"
      - "pkgdown.yaml"
    types:
      - completed

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Test release guards
        run: python3 .github/scripts/test_release.py
      - name: Prepare approved release tag
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/release.py
      - uses: ncipollo/release-action@v1
        if: steps.prepare.outputs.tag != ''
        with:
          name: Release ${{ steps.prepare.outputs.tag }}
          tag: ${{ steps.prepare.outputs.tag }}
          bodyFile: body.md
          skipIfReleaseExists: true
