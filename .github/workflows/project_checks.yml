name: Project package checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RGL_USE_NULL: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Test release guards
        run: python3 .github/scripts/test_release.py
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::lintr
            any::covr
            any::pkgdown
            cran::roxygen2@7.3.3
          needs: check
      - name: Check generated documentation
        shell: Rscript {0}
        run: |
          devtools::document()
          status <- system2("git", c("status", "--porcelain", "--",
            "DESCRIPTION", "NAMESPACE", "man"), stdout = TRUE)
          if (length(status)) stop("Generated documentation differs: ",
            paste(status, collapse = "\n"))
      - name: Check project coding conventions
        shell: Rscript {0}
        run: source(".github/scripts/lint.R")
      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--no-manual")'
          error-on: '"warning"'
      - name: Build website
        shell: Rscript {0}
        run: pkgdown::build_site(preview = FALSE)
      - name: Measure coverage
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage()
          dir.create("tmp", showWarnings = FALSE)
          saveRDS(coverage, "tmp/coverage.rds")
          covr::to_cobertura(coverage, filename = "tmp/coverage.xml")
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: tmp/coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-checks-${{ github.sha }}
          path: |
            tmp/coverage.rds
            tmp/coverage.xml
            docs
          if-no-files-found: ignore
