name: pkgcheck

# This will cancel running jobs once a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # Manually trigger the Action under Actions/pkgcheck
  workflow_dispatch:
  pull_request:
  # Run on every push to main
  push:
    branches:
      - main
      - master

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Trust checkout in pkgcheck container
        run: |
          mkdir -p "$RUNNER_TEMP/_github_home"
          git config --file "$RUNNER_TEMP/_github_home/.gitconfig" \
            --add safe.directory /github/workspace

      - name: Report rOpenSci diagnostics
        id: diagnostics
        uses: ropensci-review-tools/pkgcheck-action@main
        continue-on-error: true
      - name: Explain diagnostic status
        if: always()
        run: |
          {
            echo '### rOpenSci diagnostics'
            echo 'These reports inform review; project_checks.yml and the OS matrix gate this package.'
            echo 'Branch naming and cyclomatic complexity are advisory under the neuroatlas policy.'
            echo 'Diagnostic action outcome: ${{ steps.diagnostics.outcome }}'
          } >> "$GITHUB_STEP_SUMMARY"
